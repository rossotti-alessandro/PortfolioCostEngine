[project]
name = "pce"
version = "0.1.0"
description = "PortfolioCostEngine backend: document intake, evidence extraction, Decimal cost engine and API."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Exact pins. Bump them in a dedicated `deps:` PR, never inside a feature PR (docs/adr/0003).
dependencies = [
  # API and data model
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "python-multipart==0.0.33",
  "structlog==26.1.0",
  # Born-digital PDF text, words and geometry (bbox per word), page render.
  # PyMuPDF is deliberately excluded: AGPL-3.0 (docs/adr/0003). Use pdfplumber + pypdfium2.
  "pdfplumber==0.11.10",
  "pypdfium2==5.15.0",
  "pypdf==7.0.0",
  # Scanned PDF OCR: Tesseract 5 via ocrmypdf (adds a text layer) and pytesseract (word boxes)
  "ocrmypdf==17.13.0",
  "pytesseract==0.3.13",
  # Spreadsheets and CSV
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "pandas==3.1.1",
  # File safety and identifiers
  "python-magic==0.4.27",
  "defusedxml==0.7.1",
  "python-stdnum==2.2",
  # Public product-document retrieval (KID, factsheet) through an allowlisted client
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
]

[project.optional-dependencies]
# Layout and table understanding (pulls PyTorch, about 1-2 GB). Install with: uv sync --extra docling
docling = ["docling==2.148.0"]
# Local OCR/VLM candidates for the SC benchmark story only (heavy; not installed by default).
vlm = ["paddleocr==3.7.0"]

[dependency-groups]
dev = [
  "ruff==0.17.4",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.170.15",
  "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pce"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603"]  # tests spawn the current interpreter only

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "ocr: needs the Tesseract binary",
  "docling: needs the docling extra",
]
